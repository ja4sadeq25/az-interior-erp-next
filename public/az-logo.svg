<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Texture pattern matching the logo -->
    <pattern id="diag-ribs" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d4ab00" stroke-width="1.2" opacity="0.45" />
    </pattern>
    <!-- Soft inner shadow & gradient -->
    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CF1D"/>
      <stop offset="100%" stop-color="#E1B80D"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#yellow-grad)" />
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="url(#diag-ribs)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="26" y="26" width="460" height="460" rx="98" ry="98" fill="none" stroke="#FFF7A1" stroke-width="3" opacity="0.3" />

  <!-- Center Text A~Z in bold white -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="middle" 
    fill="#FFFFFF" 
    font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" 
    font-weight="800" 
    font-size="168" 
    letter-spacing="-2px"
  >A~Z</text>
</svg>
